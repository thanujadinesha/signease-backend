# ─────────────────────────────────────────────────────────────────────────────
# Add these to your EXISTING docker-compose.yml on the VPS
# ─────────────────────────────────────────────────────────────────────────────

# 1. Add these to your root .env file:
#
#    POSTGRES_DB_SIGNEASE=signease_db
#    SIGNEASE_JWT_SECRET=replace-with-a-long-random-secret
#    SIGNEASE_ALLOWED_ORIGINS=https://signease.veloxio.cloud
#    SIGNEASE_API_URL=https://apisignease.veloxio.cloud

# 2. Add these service blocks inside your `services:` section:

  signease-backend:
    build: ./signease_backend
    container_name: signease-backendx
    restart: always
    expose:
      - '3004'
    environment:
      NODE_ENV: ${NODE_ENV}
      DB_HOST: postgres16
      DB_PORT: ${POSTGRES_PORT}
      DB_NAME: ${POSTGRES_DB_SIGNEASE}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${SIGNEASE_JWT_SECRET}
      PORT: 3004
      ALLOWED_ORIGINS: ${SIGNEASE_ALLOWED_ORIGINS}
    depends_on:
      - db

  signease-web:
    build:
      context: ./signease_web
      args:
        # Baked into the Next.js client bundle at build time
        NEXT_PUBLIC_API_URL: ${SIGNEASE_API_URL}
    container_name: signease-webx
    restart: always
    expose:
      - '3003'
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: 3003
    depends_on:
      - signease-backend

